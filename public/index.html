<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Schedule Planner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="desktopShell" class="desktop-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-brand-row">
            <button
              id="btnThemeToggle"
              class="icon-button theme-toggle-button"
              type="button"
              aria-label="切换深色模式"
              title="切换深色模式"
            >
              ◐
            </button>
          </div>

        </div>

        <nav class="sidebar-nav">
          <button id="navViewChat" class="nav-button active" type="button" data-view="chat">
            <span class="nav-title">对话</span>
          </button>
          <button id="navViewSchedule" class="nav-button" type="button" data-view="schedule">
            <span class="nav-title">日程</span>
          </button>
          <button id="navViewSettings" class="nav-button" type="button" data-view="settings">
            <span class="nav-title">设置</span>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <section id="viewChat" class="workspace-view chat-view" data-view-panel="chat">
          <div class="view-head">
            <div>
              <h1>对话</h1>
            </div>
            <div class="row">
              <button id="btnAiProposalReview" class="btn tiny hidden" type="button">查看建议</button>
              <button id="btnAiProposalDiscard" class="btn tiny hidden" type="button">丢弃</button>
              <button id="btnChatClear" class="btn tiny" type="button">清空</button>
            </div>
          </div>

          <div id="aiProposalHint" class="modal-note hidden"></div>

          <section class="chat-surface">
            <div id="chatMessages" class="chat-messages chat-messages-large"></div>

            <div class="chat-prompts">
              <button class="btn tiny" type="button" data-chat-prompt="帮我安排今晚 2 小时。">今晚</button>
              <button class="btn tiny" type="button" data-chat-prompt="给我一个专注的上午安排。">上午</button>
              <button class="btn tiny" type="button" data-chat-prompt="如果我漏掉了一个关键任务，今天怎么调整？">补救</button>
            </div>

            <form id="chatForm" class="chat-form">
              <input id="chatInput" class="input" placeholder="输入你的计划、限制或调整要求" maxlength="1000" />
              <button id="btnChatSend" class="btn primary" type="submit">发送</button>
            </form>
          </section>
        </section>

        <section id="viewSchedule" class="workspace-view schedule-view hidden" data-view-panel="schedule">
          <input id="planDate" class="schedule-hidden-input" type="date" />

          <div id="scheduleShell" class="schedule-shell">
            <aside class="schedule-sidebar-panel">
              <div class="schedule-sidebar-frame">
                <section id="scheduleSectionCalendar" class="schedule-sidebar-section schedule-mini-calendar-card">
                  <div class="schedule-sidebar-card-head">
                    <div class="schedule-sidebar-section-label">日历</div>
                    <button
                      id="btnToggleScheduleSectionCalendar"
                      class="icon-button schedule-section-toggle"
                      type="button"
                      aria-label="Collapse calendar panel"
                      aria-expanded="true"
                      aria-controls="scheduleSectionCalendarBody"
                    >
                      -
                    </button>
                  </div>
                  <div id="scheduleSectionCalendarBody" class="schedule-sidebar-card-body">
                    <div class="schedule-mini-calendar-head">
                      <button id="btnMiniMonthPrev" class="icon-button" type="button" aria-label="Previous month">&lt;</button>
                      <div id="miniMonthLabel" class="schedule-mini-calendar-title">April 2026</div>
                      <button id="btnMiniMonthNext" class="icon-button" type="button" aria-label="Next month">&gt;</button>
                    </div>
                    <div class="mini-month-weekdays">
                      <span>日</span>
                      <span>一</span>
                      <span>二</span>
                      <span>三</span>
                      <span>四</span>
                      <span>五</span>
                      <span>六</span>
                    </div>
                    <div id="miniMonthGrid" class="mini-month-grid"></div>
                  </div>
                </section>
              </div>
            </aside>

            <div class="schedule-main-stage">
              <div class="schedule-topbar">
                <div class="schedule-topbar-left">
                  <button id="btnScheduleToday" class="btn secondary" type="button">今天</button>
                  <div class="schedule-nav-cluster">
                    <button id="btnSchedulePrev" class="icon-button" type="button" aria-label="Previous period">&lt;</button>
                    <button id="btnScheduleNext" class="icon-button" type="button" aria-label="Next period">&gt;</button>
                  </div>
                  <div id="schedulePeriodLabel" class="schedule-period-label">April 2026</div>
                </div>

                <div class="schedule-topbar-right">
                  <button id="btnScheduleSidebarCollapse" class="btn secondary" type="button">面板</button>
                  <div class="segmented">
                    <button id="btnScheduleModeWeek" class="segment-btn active" type="button" data-schedule-mode="week">周</button>
                    <button id="btnScheduleModeDay" class="segment-btn" type="button" data-schedule-mode="day">日</button>
                  </div>
                  <button id="btnToggleDayUtilities" class="btn secondary" type="button">工具</button>
                  <button id="btnCalendarSettings" class="btn secondary" type="button">日历设置</button>
                  <div class="pill" id="scheduleZoomPreview">100%</div>
                  <div class="pill" id="weekZoomPreview">100%</div>
                </div>
              </div>

              <div id="scheduleAiBanner" class="schedule-ai-banner hidden">
                <div id="scheduleAiBannerText" class="schedule-ai-banner-text"></div>
                <div class="row">
                  <button id="btnScheduleAiJumpDay" class="btn tiny" type="button">日</button>
                  <button id="btnScheduleAiJumpWeek" class="btn tiny" type="button">周</button>
                  <button id="btnScheduleAiClear" class="btn tiny" type="button">关闭</button>
                </div>
              </div>

              <div class="schedule-body-shell">
                <section id="scheduleDayPanel" class="schedule-mode-panel hidden">
                  <div id="dayWorkbench" class="day-workbench">
                    <section class="schedule-visual-card">
                      <div id="scheduleToolbar" class="calendar-toolbar schedule-panel-toolbar">
                        <div class="calendar-toolbar-group">
                          <div class="pill" id="dayRange">-</div>
                          <div class="pill" id="progress">完成 0%</div>
                        </div>

                        <div class="calendar-toolbar-group">
                          <label class="toggle-chip">
                            <input id="toggleBuffers" type="checkbox" checked />
                            <span>缓冲</span>
                          </label>
                          <div class="pill" id="calendarSnapPreview">15 分钟</div>
                        </div>
                      </div>

                      <div class="schedule-visual-frame">
                        <div id="scheduleIssues" class="issues hidden"></div>
                        <div id="schedule" class="schedule">
                          <div class="empty-state">加载中</div>
                        </div>
                      </div>
                    </section>

                    <aside id="scheduleDayUtilities" class="reminder-sidecard hidden">
                      <div class="subhead">
                        <h2>提醒</h2>
                        <button id="btnCopyReminder" class="btn tiny" type="button">复制</button>
                      </div>

                      <div class="stack">
                        <div class="row">
                          <button id="btnReminder" class="btn secondary" type="button">生成提醒</button>
                          <button id="btnShare" class="btn secondary" type="button">分享图</button>
                        </div>

                        <div id="reminder" class="reminder">先生成日程</div>
                        <canvas id="shareCanvas" width="1080" height="1350" class="canvas"></canvas>
                        <a id="downloadLink" class="btn primary hidden" download="sleep-card.png">下载 PNG</a>
                      </div>
                    </aside>
                  </div>
                </section>

                <section id="scheduleWeekPanel" class="schedule-mode-panel">
                  <section class="schedule-visual-card">
                    <div class="calendar-toolbar schedule-panel-toolbar">
                      <div class="calendar-toolbar-group">
                        <div class="pill" id="weekRange">-</div>
                      </div>
                    </div>
                    <div class="schedule-visual-frame">
                      <div id="weekPlan" class="empty-state">加载中</div>
                    </div>
                  </section>
                </section>
              </div>
            </div>
          </div>
        </section>

        <section id="viewSettings" class="workspace-view settings-view hidden" data-view-panel="settings">
          <div class="view-head">
            <div>
              <h1>设置</h1>
            </div>
          </div>

          <div class="settings-shell">
            <aside class="settings-rail">
              <button class="settings-nav-button active" type="button" data-settings-section="app">
                <span class="nav-title">应用</span>
              </button>
              <button class="settings-nav-button" type="button" data-settings-section="ai">
                <span class="nav-title">AI</span>
              </button>
              <button class="settings-nav-button" type="button" data-settings-section="rules">
                <span class="nav-title">规则</span>
              </button>
              <button class="settings-nav-button" type="button" data-settings-section="community">
                <span class="nav-title">社区</span>
              </button>
            </aside>

            <div class="settings-stage">
              <section class="settings-panel" data-settings-panel="app">
                <div class="subhead">
                  <h2>默认</h2>
                  <button id="btnSaveWorkspacePrefs" class="btn tiny" type="button">保存</button>
                </div>

                <div class="settings-panel-body">
                  <div class="settings-inline-grid">
                    <label class="field">
                      <span>启动页面</span>
                      <select id="defaultStartupView" class="input select full">
                        <option value="chat">对话</option>
                        <option value="schedule">日程</option>
                        <option value="settings">设置</option>
                      </select>
                    </label>

                    <label class="field">
                      <span>日程视图</span>
                      <select id="defaultScheduleMode" class="input select full">
                        <option value="week">周</option>
                        <option value="day">日</option>
                      </select>
                    </label>

                    <label class="checkbox settings-checkbox-card">
                      <input id="darkModeEnabled" type="checkbox" />
                      <span>深色模式</span>
                    </label>
                  </div>

                  <div id="workspacePrefsStatus" class="modal-note hidden"></div>
                </div>
              </section>

              <section class="settings-panel hidden" data-settings-panel="ai">
                <div class="subhead">
                  <h2>AI API</h2>
                  <div class="row">
                    <button id="btnDesktopOpenConfig" class="btn tiny" type="button">配置</button>
                    <button id="btnDesktopOpenData" class="btn tiny" type="button">数据</button>
                  </div>
                </div>

                <div class="settings-panel-body">
                  <div class="settings-inline-grid">
                    <label class="field">
                      <span>回复语气</span>
                      <select id="tone" class="input select full">
                        <option value="gentle">温和</option>
                        <option value="snarky" selected>直接</option>
                        <option value="roast">狠一点</option>
                      </select>
                    </label>
                  </div>

                  <form id="aiConfigForm" class="stack">
                    <label class="field">
                      <span>Base URL</span>
                      <input id="relayBaseUrl" class="input" placeholder="https://api.openai.com/v1" />
                    </label>

                    <div class="settings-inline-grid">
                      <label class="field">
                        <span>Model</span>
                        <input id="relayModel" class="input" placeholder="gpt-4.1-mini" />
                      </label>
                      <label class="field">
                        <span>Chat Path</span>
                        <input id="relayChatPath" class="input" placeholder="/chat/completions" />
                      </label>
                    </div>

                    <label class="field">
                      <span>API Key</span>
                      <input id="relayApiKey" class="input" type="password" placeholder="sk-..." />
                    </label>

                    <div class="settings-inline-grid">
                      <label class="field">
                        <span>Key Header</span>
                        <input id="relayApiKeyHeader" class="input" placeholder="Authorization" />
                      </label>
                      <label class="field">
                        <span>Key Prefix</span>
                        <input id="relayApiKeyPrefix" class="input" placeholder="Bearer " />
                      </label>
                    </div>

                    <div class="row">
                      <button id="btnSaveAiConfig" class="btn primary" type="submit">保存</button>
                    </div>

                    <div id="aiConfigStatus" class="modal-note hidden"></div>
                  </form>

                  <div id="storageNote" class="hint">桌面版使用本地配置。</div>
                  <div id="desktopBanner" class="desktop-banner hidden">
                    <div id="desktopRuntimeText" class="desktop-runtime-text">桌面模式</div>
                  </div>
                </div>
              </section>

              <section class="settings-panel settings-panel-rules hidden" data-settings-panel="rules">
                <div class="rules-shell">
                  <div class="rules-shell-head">
                    <div class="subhead">
                      <h2>规则</h2>
                      <div class="segmented">
                        <button class="segment-btn active" type="button" data-rules-mode="fixed">固定</button>
                        <button class="segment-btn" type="button" data-rules-mode="task">任务</button>
                      </div>
                    </div>
                  </div>

                  <div id="rulesFixedPanel" class="rules-panel">
                    <section class="rule-list-card">
                      <div class="subhead">
                        <h2>固定事项</h2>
                        <button id="btnNewFixed" class="btn tiny" type="button">新建</button>
                      </div>
                      <div id="fixedList" class="rule-list"></div>
                    </section>

                    <section class="rule-form-card">
                      <div class="subhead">
                        <h2 id="fixedEditorTitle">新固定事项</h2>
                        <button id="btnDeleteFixed" class="btn tiny danger hidden" type="button">删除</button>
                      </div>

                      <form id="fixedForm" class="stack">
                        <label class="field">
                          <span>标题</span>
                          <input id="fixedTitle" class="input" placeholder="课程 / 通勤 / 会议" />
                        </label>

                        <div class="settings-inline-grid">
                          <label class="field">
                            <span>开始</span>
                            <input id="fixedStart" class="input time full" type="time" value="09:00" />
                          </label>
                          <label class="field">
                            <span>结束</span>
                            <input id="fixedEnd" class="input time full" type="time" value="10:30" />
                          </label>
                        </div>

                        <label class="field">
                          <span>缓冲分钟</span>
                          <input id="fixedBuffer" class="input small full" type="number" min="0" max="180" value="0" placeholder="buffer min" />
                        </label>

                        <div id="fixedRepeatReadonly" class="modal-note hidden"></div>

                        <div class="repeat-box">
                          <div class="repeat-label">重复日期</div>
                          <div class="weekday-row">
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="1" /><span>Mon</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="2" /><span>Tue</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="3" /><span>Wed</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="4" /><span>Thu</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="5" /><span>Fri</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="6" /><span>Sat</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-fixed value="0" /><span>Sun</span></label>
                          </div>
                        </div>

                        <div class="row">
                          <button id="btnSubmitFixed" class="btn primary" type="submit">保存</button>
                        </div>
                        <div id="fixedEditorStatus" class="modal-note hidden"></div>
                      </form>
                    </section>
                  </div>

                  <div id="rulesTaskPanel" class="rules-panel hidden">
                    <section class="rule-list-card">
                      <div class="subhead">
                        <h2>重复任务</h2>
                        <button id="btnNewTask" class="btn tiny" type="button">新建</button>
                      </div>
                      <div id="taskList" class="rule-list"></div>
                    </section>

                    <section class="rule-form-card">
                      <div class="subhead">
                        <h2 id="taskEditorTitle">新任务规则</h2>
                        <button id="btnDeleteTask" class="btn tiny danger hidden" type="button">删除</button>
                      </div>

                      <form id="taskForm" class="stack">
                        <label class="field">
                          <span>标题</span>
                          <input id="taskTitle" class="input" placeholder="背单词 / 编程 / 训练" />
                        </label>

                        <div class="settings-inline-grid">
                          <label class="field">
                            <span>类别</span>
                            <select id="taskCategory" class="input select full">
                              <option value="study">学习</option>
                              <option value="code">编程</option>
                              <option value="workout">训练</option>
                              <option value="other" selected>其他</option>
                            </select>
                          </label>
                          <label class="field">
                            <span>时长</span>
                            <input id="taskDuration" class="input small full" type="number" min="5" max="480" value="30" />
                          </label>
                        </div>

                        <div class="settings-inline-grid">
                          <label class="field">
                            <span>精力</span>
                            <select id="taskEnergy" class="input select full">
                              <option value="high">高</option>
                              <option value="medium" selected>中</option>
                              <option value="low">低</option>
                            </select>
                          </label>
                          <label class="field">
                            <span>优先级</span>
                            <select id="taskPriority" class="input select full">
                              <option value="5">5</option>
                              <option value="4">4</option>
                              <option value="3" selected>3</option>
                              <option value="2">2</option>
                              <option value="1">1</option>
                            </select>
                          </label>
                        </div>

                        <div class="settings-inline-grid">
                          <label class="field">
                            <span>每周次数</span>
                            <input id="taskWeeklyTarget" class="input small full" type="number" min="0" max="7" value="0" placeholder="weekly count" title="0 = fixed weekdays; >0 = auto assign per week" />
                          </label>
                          <label class="checkbox settings-checkbox-card">
                            <input id="taskSplit" type="checkbox" />
                            <span>允许拆分</span>
                          </label>
                        </div>

                        <div class="repeat-box">
                          <div class="repeat-label">日期</div>
                          <div class="weekday-row">
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="1" /><span>Mon</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="2" /><span>Tue</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="3" /><span>Wed</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="4" /><span>Thu</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="5" /><span>Fri</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="6" /><span>Sat</span></label>
                            <label class="weekday-chip"><input type="checkbox" data-weekday-task value="0" /><span>Sun</span></label>
                          </div>
                        </div>

                        <div class="row">
                          <button id="btnSubmitTask" class="btn primary" type="submit">保存</button>
                        </div>
                        <div id="taskEditorStatus" class="modal-note hidden"></div>
                      </form>
                    </section>
                  </div>
                </div>
              </section>

              <section class="settings-panel hidden" data-settings-panel="community">
                <div class="subhead">
                  <h2>社区</h2>
                  <div class="row">
                    <button id="btnRefreshCommunity" class="btn secondary" type="button">刷新</button>
                    <button id="btnPostReminder" class="btn primary" type="button">发布提醒</button>
                  </div>
                </div>
                <div class="settings-panel-body">
                  <div id="communityList" class="list"></div>
                </div>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="contextMenu" class="context-menu hidden"></div>

    <div id="eventModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <div class="modal-card">
        <div class="subhead">
          <h3 id="eventModalTitle">编辑</h3>
          <button id="btnCloseEventModal" class="btn tiny" type="button">关闭</button>
        </div>
        <div id="eventModalHint" class="modal-note"></div>
        <form id="eventForm" class="stack">
          <input id="eventBlockId" type="hidden" />
          <input id="eventMode" type="hidden" />
          <input id="eventBlockType" type="hidden" />

          <div class="modal-grid">
            <label class="field">
              <span>标题</span>
              <input id="eventTitle" class="input" />
            </label>
            <label class="field">
              <span>开始</span>
              <input id="eventStart" class="input time" type="time" />
            </label>
            <label class="field">
              <span>结束</span>
              <input id="eventEnd" class="input time" type="time" />
            </label>

            <label id="eventCategoryField" class="field">
              <span>类别</span>
              <select id="eventCategory" class="input select">
                <option value="study">学习</option>
                <option value="code">编程</option>
                <option value="workout">训练</option>
                <option value="other">其他</option>
              </select>
            </label>

            <label id="eventEnergyField" class="field">
              <span>精力</span>
              <select id="eventEnergy" class="input select">
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
              </select>
            </label>

            <label id="eventPriorityField" class="field">
              <span>优先级</span>
              <select id="eventPriority" class="input select">
                <option value="5">5</option>
                <option value="4">4</option>
                <option value="3">3</option>
                <option value="2">2</option>
                <option value="1">1</option>
              </select>
            </label>

            <label id="eventBufferField" class="field hidden">
              <span>缓冲分钟</span>
              <input id="eventBuffer" class="input small" type="number" min="0" max="180" value="0" />
            </label>
          </div>

          <div id="eventRecurrenceSection" class="repeat-box hidden">
            <label class="checkbox">
              <input id="eventRecurringEnabled" type="checkbox" />
              <span>重复事项</span>
            </label>

            <div class="repeat-label">重复日期</div>
            <div class="weekday-row">
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="1" /><span>Mon</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="2" /><span>Tue</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="3" /><span>Wed</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="4" /><span>Thu</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="5" /><span>Fri</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="6" /><span>Sat</span></label>
              <label class="weekday-chip"><input type="checkbox" data-weekday-event value="0" /><span>Sun</span></label>
            </div>

            <div class="modal-grid">
              <label class="field">
                <span>重复方式</span>
                <select id="eventRecurrenceMode" class="input select">
                  <option value="forever">长期</option>
                  <option value="count">次数</option>
                  <option value="until">截止日期</option>
                </select>
              </label>

              <label id="eventRecurrenceCountField" class="field hidden">
                <span>次数</span>
                <input id="eventRecurrenceCount" class="input small full" type="number" min="1" max="365" value="8" />
              </label>

              <label id="eventRecurrenceUntilField" class="field hidden">
                <span>截止</span>
                <input id="eventRecurrenceUntil" class="input" type="date" />
              </label>
            </div>
          </div>

          <div class="modal-actions">
            <button id="btnDeleteEvent" class="btn danger hidden" type="button">删除</button>
            <button id="btnCancelEvent" class="btn secondary" type="button">取消</button>
            <button id="btnSaveEvent" class="btn primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="calendarSettingsModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="calendarSettingsTitle">
      <div class="modal-card modal-card-sm">
        <div class="subhead">
          <h3 id="calendarSettingsTitle">日历设置</h3>
          <button id="btnCloseCalendarSettings" class="btn tiny" type="button">关闭</button>
        </div>

        <form id="calendarSettingsForm" class="stack">
          <label class="checkbox">
            <input id="calendarShowBuffers" type="checkbox" />
            <span>显示缓冲</span>
          </label>

          <label class="field">
            <span>吸附</span>
            <select id="calendarSnapMinutes" class="input select">
              <option value="5">5 分钟</option>
              <option value="10">10 分钟</option>
              <option value="15">15 分钟</option>
              <option value="30">30 分钟</option>
            </select>
          </label>

          <div class="modal-actions">
            <button id="btnCancelCalendarSettings" class="btn secondary" type="button">取消</button>
            <button id="btnSaveCalendarSettings" class="btn primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="aiApplyModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="aiApplyTitle">
      <div class="modal-card modal-card-sm">
        <div class="subhead">
          <h3 id="aiApplyTitle">应用建议</h3>
          <button id="btnCloseAiApply" class="btn tiny" type="button">关闭</button>
        </div>
        <div id="aiApplySummary" class="modal-note"></div>
        <div id="aiApplyDetails" class="modal-detail-list"></div>
        <div class="modal-actions">
          <button id="btnCancelAiApply" class="btn secondary" type="button">取消</button>
          <button id="btnConfirmAiApply" class="btn primary" type="button">应用</button>
        </div>
      </div>
    </div>

    <div
      id="conflictResolutionModal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="conflictResolutionTitle"
    >
      <div class="modal-card modal-card-sm">
        <div class="subhead">
          <h3 id="conflictResolutionTitle">时间冲突</h3>
          <button id="btnCloseConflictResolution" class="btn tiny" type="button">X</button>
        </div>
        <div id="conflictResolutionSummary" class="modal-note"></div>
        <div id="conflictResolutionDetails" class="modal-detail-list"></div>
        <div class="modal-actions">
          <button id="btnEditConflictResolution" class="btn secondary" type="button">继续修改</button>
          <button id="btnConfirmConflictResolution" class="btn primary" type="button">仍然保存</button>
        </div>
      </div>
    </div>

    <div id="taskScopeModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="taskScopeTitle">
      <div class="modal-card modal-card-sm">
        <div class="subhead">
          <h3 id="taskScopeTitle">应用范围</h3>
          <button id="btnCloseTaskScope" class="btn tiny" type="button">X</button>
        </div>
        <div id="taskScopeSummary" class="modal-note"></div>
        <div class="modal-actions modal-actions-triple">
          <button id="btnTaskScopeSingle" class="btn secondary" type="button">仅当天</button>
          <button id="btnTaskScopeFollowing" class="btn secondary" type="button">当天及以后</button>
          <button id="btnTaskScopeAll" class="btn primary" type="button">全部重复项</button>
        </div>
      </div>
    </div>

    <div id="scheduleUndoToast" class="schedule-undo-toast hidden" role="status" aria-live="polite">
      <div class="schedule-undo-card">
        <div class="schedule-undo-head">
          <div class="schedule-undo-title">已更新日程</div>
          <button id="btnCloseScheduleUndo" class="schedule-undo-close" type="button" aria-label="Close undo notice">X</button>
        </div>
        <div id="scheduleUndoSummary" class="schedule-undo-summary">本操作更改了 1 个日程</div>
        <div id="scheduleUndoLabel" class="schedule-undo-label hidden"></div>
        <div class="schedule-undo-actions">
          <button id="btnScheduleUndo" class="schedule-undo-btn" type="button" title="Undo">↶</button>
          <button id="btnScheduleUndoApply" class="schedule-undo-btn keep" type="button" title="Keep">✓</button>
        </div>
        <div class="schedule-undo-progress">
          <div id="scheduleUndoProgressBar" class="schedule-undo-progress-bar"></div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
